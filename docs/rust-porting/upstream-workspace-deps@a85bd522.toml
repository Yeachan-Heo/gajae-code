# Verbatim snapshot of the upstream root [workspace.dependencies] table.
# Source: https://github.com/can1357/oh-my-pi/blob/a85bd5228d9f0f619deade1db78fa49420a721e1/Cargo.toml
# Copyright (c) the oh-my-pi authors. Licensed under the MIT License.
# Used only by `bun scripts/verify-rust-porting-inventory.ts --deps` (offline comparison).
# Do not edit by hand: replace wholesale when the inventory pin is bumped.

[workspace.dependencies]

# ──────────────────────────────────────────────────────────────────────────────
# Internal Libraries
# ──────────────────────────────────────────────────────────────────────────────
pi-ast = { path = "crates/pi-ast" }
pi-diff = { path = "crates/pi-diff" }
pi-edit = { path = "crates/pi-edit" }
pi-iso = { path = "crates/pi-iso" }
pi-shell = { path = "crates/pi-shell" }
pi-voice = { path = "crates/pi-voice" }
pi-walker = { path = "crates/pi-walker" }
pi-vcs = { path = "crates/pi-vcs" }
pi-vfs = { path = "crates/pi-vfs" }
brush-core = { path = "crates/vendor/brush-core" }
pi-builtins = { path = "crates/pi-builtins" }

# ──────────────────────────────────────────────────────────────────────────────
# Async Runtime & Concurrency
# ──────────────────────────────────────────────────────────────────────────────
async-trait = "0.1"
futures = "0.3"
dashmap = "6.2"
parking_lot = "0.12.5"
rayon = "1.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
flume = "0.12"

# ──────────────────────────────────────────────────────────────────────────────
# Serialization & Data Formats
# ──────────────────────────────────────────────────────────────────────────────
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"

# ──────────────────────────────────────────────────────────────────────────────
# Error Handling
# ──────────────────────────────────────────────────────────────────────────────
anyhow = "1.0"
thiserror = "2"
bytes = "1"

# ──────────────────────────────────────────────────────────────────────────────
# CLI & Configuration
# ──────────────────────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive"] }

# ──────────────────────────────────────────────────────────────────────────────
# Text Processing & Parsing
# ──────────────────────────────────────────────────────────────────────────────
pdf-inspector = "1"
regex = "1"
similar = "3.2.0"
fontdue = { version = "0.9", default-features = false }

# ──────────────────────────────────────────────────────────────────────────────
# Data Structures - Collections
# ──────────────────────────────────────────────────────────────────────────────
phf = { version = "0.14", features = ["macros"] }
heapless = "0.9"
smallvec = { version = "1.16.1", features = [
   "serde",
   "write",
   "union",
   "const_new",
] }

# ──────────────────────────────────────────────────────────────────────────────
# Hashing
# ──────────────────────────────────────────────────────────────────────────────
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }

# ──────────────────────────────────────────────────────────────────────────────
# Audio & Realtime Media
# ──────────────────────────────────────────────────────────────────────────────
opus = "0.4.0"
webrtc = "0.17.2"

# ──────────────────────────────────────────────────────────────────────────────
# System & Platform
# ──────────────────────────────────────────────────────────────────────────────
libc = "0.2"
os_pipe = "1"
windows-sys = { version = "0.61", features = [
   "Win32_Foundation",
   "Win32_Globalization",
   "Win32_Media_Audio",
   "Win32_Media_Multimedia",
   "Win32_Security",
   "Win32_Storage_FileSystem",
   "Win32_Storage_ProjectedFileSystem",
   "Win32_System_Com",
   "Win32_System_LibraryLoader",
   "Win32_System_IO",
   "Win32_System_Ioctl",
   "Win32_System_Threading",
] }
# Transitive-only pin (wired through crates/pi-natives build-deps so the
# constraint participates in resolution): cc 1.2.x passes
# FILE_ATTRIBUTE_TEMPORARY to OpenOptionsExt::custom_flags as u32, but
# find-msvc-tools 0.1.13 retyped that constant to i32, breaking every Windows
# build. tree-sitter-sequel caps cc at ~1.2.1 so the fixed cc 1.4.x line is
# out of reach; hold 0.1.12 until upstream ships a compatible release.
find-msvc-tools = "=0.1.12"
winreg = "0.56"

# ──────────────────────────────────────────────────────────────────────────────
# Node.js Bindings (NAPI)
# ──────────────────────────────────────────────────────────────────────────────
napi = { version = "3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-build = "2"
napi-derive = "3"

# ──────────────────────────────────────────────────────────────────────────────
# Terminal & PTY
# ──────────────────────────────────────────────────────────────────────────────
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
clipboard-win = "5.4"
icy_sixel = "0.7"
portable-pty = "0.9"
shlex = "2"

# ──────────────────────────────────────────────────────────────────────────────
# Search & File Walking
# ──────────────────────────────────────────────────────────────────────────────
globset = "0.4"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

# ──────────────────────────────────────────────────────────────────────────────
# Image Processing & Syntax Highlighting
# ──────────────────────────────────────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = [
   "png",
   "jpeg",
   "gif",
   "webp",
] }
resvg = "0.48"
# Not used directly: activates zune-jpeg's non-default `log` feature so image's
# JPEG decoder compiles — zune-jpeg 0.5.15's no-log stub macros are not
# expression-safe and the crate fails to build without it.
zune-jpeg = { version = "0.5", default-features = false, features = ["log"] }
# Not used directly: pins tinyvec to fixed 1.13.3 because 1.13.0 was published broken
# (cannot find macro `vec` in alloc-only context).
tinyvec = "=1.13.3"
png = "0.18"
inferno = { version = "0.12", default-features = false }
syntect = { version = "5.3", default-features = false, features = [
   "default-syntaxes",
   "default-themes",
   "regex-fancy",
   "yaml-load",
] }

# ──────────────────────────────────────────────────────────────────────────────
# Markup Conversion
# ──────────────────────────────────────────────────────────────────────────────
html-to-markdown-rs = { version = "3.12.4", default-features = false }

# ──────────────────────────────────────────────────────────────────────────────
# Tokenization
# ──────────────────────────────────────────────────────────────────────────────
xutf = "1.5"
zstd = "0.14"
fancy-regex = "0.16"
tiktoken-rs = "0.12"

# ──────────────────────────────────────────────────────────────────────────────
# Shell Parsing
# ──────────────────────────────────────────────────────────────────────────────
brush-parser = "0.4"
# ──────────────────────────────────────────────────────────────────────────────
# Version Control (in-process git + jujutsu)
# ──────────────────────────────────────────────────────────────────────────────
# gix is pinned to the minor jj-lib depends on so both VCS backends share one
# gitoxide stack in the binary. No transport/credential features: network ops
# (clone/fetch/push) deliberately shell out to the git CLI for auth parity.
gix = { version = "0.85", default-features = false, features = [
   "attributes",
   "blob-diff",
   "dirwalk",
   "excludes",
   "index",
   "max-performance-safe",
   "merge",
   "revision",
   "sha1",
   "sha256",
   "status",
   "tree-editor",
   "worktree-mutation",
   "zlib-rs",
] }
jj-lib = { version = "0.44", default-features = false, features = ["git"] }

# ──────────────────────────────────────────────────────────────────────────────
# AST & Tree-Sitter
# ──────────────────────────────────────────────────────────────────────────────
ast-grep-core = { version = "0.39", default-features = false, features = [
   "tree-sitter",
] }
tree-sitter = "0.25"
tree-sitter-astro = { version = "0.1.1", package = "tree-sitter-astro-next" }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure = "0.1"
tree-sitter-cmake = "0.7.5"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-dockerfile = { version = "0.2.0", package = "tree-sitter-dockerfile-updated" }
tree-sitter-elixir = "0.3"
tree-sitter-elisp = "1.7.2"
tree-sitter-erlang = "0.16.0"
tree-sitter-fortran = "0.6.0"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.1.0"
tree-sitter-haskell = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-just = "0.2.0"
tree-sitter-kotlin = { version = "0.4", package = "tree-sitter-kotlin-sg" }
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.24.2"
tree-sitter-odin = "1.3"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26.4"
tree-sitter-proto = "0.4.0"
tree-sitter-python = "0.25"
tree-sitter-r = "1.3.0"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-solidity = "1.2"
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel" }
tree-sitter-starlark = "1.3"
tree-sitter-svelte = { version = "0.1.1", package = "tree-sitter-svelte-next" }
tree-sitter-swift = "0.7"
tree-sitter-tlaplus = "1.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-verilog = "1.0"
tree-sitter-vue = { version = "0.1.0", package = "tree-sitter-vue-next" }
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"

# ──────────────────────────────────────────────────────────────────────────────
# Unsorted (added by `cargo add` - move into a section above)
# ──────────────────────────────────────────────────────────────────────────────
