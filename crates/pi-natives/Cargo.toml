[package]
name = "pi-natives"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
arboard.workspace = true
ast-grep-core.workspace = true
clap.workspace = true
dashmap.workspace = true
globset.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
html-to-markdown-rs.workspace = true
icy_sixel.workspace = true
ignore.workspace = true
image.workspace = true
# Feature activation only (see workspace manifest): zune-jpeg needs `log` to compile.
zune-jpeg.workspace = true
# Upstream pinning only (see workspace manifest): tinyvec 1.13.0 is broken.
tinyvec.workspace = true
inferno = { workspace = true, optional = true }
gjc-sdk = { path = "../gjc-sdk" }
memmap2.workspace = true
napi.workspace = true
napi-derive.workspace = true
parking_lot.workspace = true
phf.workspace = true
pi-ast.workspace = true
pi-iso.workspace = true
pi-shell.workspace = true
portable-pty.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
smallvec.workspace = true
syntect.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
xxhash-rust.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(windows)'.dependencies]
winreg.workspace = true
windows-sys.workspace = true

[build-dependencies]
# Transitive-only pin: see find-msvc-tools in the root workspace manifest.
find-msvc-tools.workspace = true
napi-build.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
full-langs = ["pi-ast/full-langs"]
prof-flamegraph = ["dep:inferno"]
