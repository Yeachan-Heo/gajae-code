name: Codex app-server drift report

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Re-export Codex main and report schema drift
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # This standalone scheduled report is deliberately advisory: its result is not
    # a main-build dependency, and a reported drift cannot update the pinned vendor.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: "1.95.0"
      - name: Clone Codex main without modifying the pinned vendor
        run: git clone --depth=1 --branch=main https://github.com/openai/codex.git "$RUNNER_TEMP/codex-main"
      - name: Re-export both profiles and report drift from the pinned vendor
        run: bun scripts/check-codex-app-server-main-drift.ts "$RUNNER_TEMP/codex-main"
