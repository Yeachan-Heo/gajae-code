name: PR contract

on:
  # This workflow is loaded from the trusted default branch. It never executes
  # code from the pull request; the base-owned validator only inspects checked-out bytes.
  pull_request_target:
    branches: [dev]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches: [dev]
    types: [submitted, edited, dismissed]
  # Maintainer self-review comments (issue #4703) are trusted workflow input: a comment
  # event re-runs the base-owned validator so the signed exact-head record is evaluated
  # server-side. Comment bytes are data only; head code is never executed. The event
  # payload has no pull_request object, so the job resolves the PR from the comment's
  # issue number and skips cleanly for comments that are not on a dev-based PR.
  issue_comment:
    # `deleted` is included so revoking the sole authorizing self-review comment
    # re-evaluates the contract: the validator re-fetches the remaining comments
    # and the PR-head result turns red when no valid backing record remains.
    types: [created, edited, deleted]


permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-contract-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-head PR contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Job-level least privilege: comment-triggered runs publish a head-bound check
    # run under the required context name (checks: write) so authorization and
    # revocation update the SAME required authority as pull_request_target runs;
    # everything else stays read-only.
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      # Fail closed: absent means the validator never reported an authorized merge.
      merge_authorized: ${{ steps.validate.outputs.merge_authorized }}
    steps:
      - name: Resolve PR head/base from the event or the comment's PR
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="${{ github.event.issue.number }}"
          if [[ -z "$number" ]]; then
            echo "::notice::event carries neither a pull_request nor an issue number; nothing to validate"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! pr_json="$(gh api "repos/${{ github.repository }}/pulls/${number}" 2>/dev/null)"; then
            echo "::notice::issue #$number is not a pull request; the PR contract does not apply"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_ref="$(printf '%s' "$pr_json" | jq -r '.base.ref')"
          if [[ "$base_ref" != "dev" ]]; then
            echo "::notice::PR #$number targets ${base_ref}, not dev; the PR contract does not apply"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "head_repo=$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(printf '%s' "$pr_json" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(printf '%s' "$pr_json" | jq -r '.base.sha')" >> "$GITHUB_OUTPUT"
      - name: Skip non-dev comments
        if: ${{ steps.pr.outputs.skip == 'true' }}
        run: echo "::notice::no dev-based PR to validate; contract check skipped"
      - name: Revoke any prior approval for this head before re-validating
        # MUST run before checkout, Bun setup, and the validator, and after PR
        # resolution only because the exact head SHA is required to address the check.
        #
        # Revoking inside the publication step still left the whole validation phase
        # uncovered: a failure during checkout, setup, or validation never reached the
        # revocation, so a previously-green "Merge approval" survived as the
        # authoritative required check. Writing the red here means any failure from
        # this point on leaves the merge blocked (#5692 review).
        if: ${{ steps.pr.outputs.skip != 'true' && github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -H "Accept: application/vnd.github+json" \
            -f name="Merge approval" \
            -f head_sha="${{ steps.pr.outputs.head_sha }}" \
            -f status="completed" \
            -f conclusion="failure" \
            -f 'output[title]="Merge approval (re-validating)"' \
            -f "output[summary]=re-validation in progress; any prior approval for this head is revoked until it completes" \
            -f "details_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        if: ${{ steps.pr.outputs.skip != 'true' }}
        with:
          fetch-depth: 0
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr-head
          persist-credentials: false
      - name: Check out trusted validator from immutable event base
        if: ${{ steps.pr.outputs.skip != 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.base_sha }}
          path: trusted-base
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        if: ${{ steps.pr.outputs.skip != 'true' }}
        with:
          bun-version: "1.4.0"
      - name: Validate body, exact head, immutable base, reviewer, and fast gate
        id: validate
        if: ${{ steps.pr.outputs.skip != 'true' }}
        env:
          GITHUB_ACTOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          unset BUN_OPTIONS
          trusted_root="$PWD/trusted-base"
          repo_root="$PWD/pr-head"
          # This check reports CONTRACT validity only; the merge-approval verdict is
          # reported by the separate "Merge approval" job from the output captured here.
          # Every path writes merge_authorized, and only an explicit authorized line from
          # the trusted validator can set it to true.
          if [[ ! -f "$trusted_root/scripts/verify-pr-verdict.ts" ]]; then
            echo "::notice::immutable base ${{ steps.pr.outputs.base_sha }} predates the trusted validator; Dev CI PR contract bootstrap remains authoritative"
            echo "merge_authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          empty_bunfig="$RUNNER_TEMP/gjc-pr-contract-empty-bunfig.toml"
          printf '# trusted empty Bun configuration\n' > "$empty_bunfig"
          log="$RUNNER_TEMP/gjc-pr-contract.log"
          cd "$trusted_root"
          status=0
          bun --no-env-file --config="$empty_bunfig" "$trusted_root/scripts/verify-pr-verdict.ts" \
            --event "$GITHUB_EVENT_PATH" --repo "$repo_root" --trusted-root "$trusted_root" \
            --gate contract 2>&1 | tee "$log" || status=$?
          authorized=false
          if grep -qxF 'gjc-merge-authorized=true' "$log"; then
            authorized=true
          fi
          echo "merge_authorized=$authorized" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish head-bound check results for comment-triggered validation
        # issue_comment runs are associated with the default-branch SHA, not the PR
        # head. Create/update a CHECK RUN on the resolved exact head with the exact
        # name of each required context ("Validate exact-head PR contract" and
        # "Merge approval" in this "PR contract" workflow), so comment events —
        # including deletion of the backing self-review record — publish to the SAME
        # required authorities the pull_request_target runs report. A parallel status
        # context could never revoke a green required check; this can. BOTH names must
        # be published: revoking a self-review comment while only republishing the
        # contract name would leave a stale green "Merge approval" behind it.
        # Branch-protection rollout contract: once this lands, dev branch
        # protection should require BOTH "PR contract / Validate exact-head PR contract"
        # and "PR contract / Merge approval" (strict); requiring only the contract name
        # would make an unapproved PR mergeable. Until protection is enabled, the Dev CI
        # PR contract bootstrap jobs plus the verdict discipline remain the enforced path.
        if: ${{ always() && github.event_name == 'issue_comment' && steps.pr.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ steps.pr.outputs.head_sha }}"
          base_sha="${{ steps.pr.outputs.base_sha }}"
          trusted_root="$PWD/trusted-base"
          conclusion="failure"
          summary="PR contract re-evaluated from a comment event"
          approval_conclusion="failure"
          approval_summary="merge authorization re-evaluated from a comment event"
          if [[ "${{ steps.validate.outcome }}" == "success" ]]; then
            conclusion="success"
            summary="PR contract valid at exact head (comment-triggered re-validation)"
            if [[ "${{ steps.validate.outputs.merge_authorized }}" == "true" ]]; then
              approval_conclusion="success"
              approval_summary="merge authorized at exact head (comment-triggered re-validation)"
            else
              approval_summary="merge not authorized at exact head; the PR contract itself is valid"
            fi
            # A trusted base that predates a required validator capability cannot
            # authorize anything; never publish success for that case, under EITHER name.
            #
            # Each capability needs its OWN marker. The self-review check alone was not
            # enough: `main` carries the self-review validator but not the approval
            # freshness rule, so a comment-triggered re-validation ran the old
            # `commit_id`-only logic and published a GREEN "Merge approval" on the exact
            # head — the #5692 hole, live on a required context, behind a guard that
            # reported the base as current (#5692 review).
            stale_base=""
            if [[ -f "$trusted_root/scripts/verify-pr-verdict.ts" ]]; then
              # Both markers must be CODE-ONLY tokens. `gajae.pr-self-review.v1` and
              # `head_ref_force_pushed` each also appear in prose, so a base that kept
              # the comments while losing the implementation would pass the guard — the
              # same shape as the bug the guard exists to catch (#5692 review).
              grep -q "selfReviewSatisfiesPolicy(" "$trusted_root/scripts/verify-pr-verdict.ts" \
                || stale_base="self-review validation"
              grep -q "reviewPrecedesHead(" "$trusted_root/scripts/verify-pr-verdict.ts" \
                || stale_base="${stale_base:+$stale_base and }approval freshness binding"
            fi
            if [[ -n "$stale_base" ]]; then
              conclusion="failure"
              summary="trusted base ${base_sha:0:10} predates $stale_base; bootstrap remains authoritative"
              approval_conclusion="failure"
              approval_summary="$summary"
            fi
          fi
          details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The approval authority was already revoked in its own step, before checkout
          # and validation, so any failure since then has left the merge blocked. Publish
          # the contract result, then raise the approval only if that write succeeded.
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -H "Accept: application/vnd.github+json" \
            -f name="Validate exact-head PR contract" \
            -f head_sha="$head_sha" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f 'output[title]="PR contract (comment-triggered exact-head re-validation)"' \
            -f "output[summary]=$summary" \
            -f "details_url=$details_url"
          # Only now may the approval authority be raised to its computed value. Reaching
          # this line means the contract publication above succeeded.
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -H "Accept: application/vnd.github+json" \
            -f name="Merge approval" \
            -f head_sha="$head_sha" \
            -f status="completed" \
            -f conclusion="$approval_conclusion" \
            -f 'output[title]="Merge approval (comment-triggered exact-head re-validation)"' \
            -f "output[summary]=$approval_summary" \
            -f "details_url=$details_url"

  merge-approval:
    name: Merge approval
    needs: [validate]
    # always() is load-bearing. GitHub reports a SKIPPED job as Success for required
    # checks (https://docs.github.com/en/pull-requests/reference/status-checks), so a
    # plain `needs:` would skip this job when the contract job fails and publish a GREEN
    # merge-approval check for a red contract — the precise hole this must not open.
    # The job therefore always runs and decides from the upstream result plus its output.
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # Reads only the upstream job's result and output: no checkout, no bun, no token.
    permissions: {}
    steps:
      - name: Require an authorized merge verdict for this exact head
        env:
          CONTRACT_RESULT: ${{ needs.validate.result }}
          MERGE_AUTHORIZED: ${{ needs.validate.outputs.merge_authorized }}
        shell: bash
        run: |
          set -euo pipefail
          echo "contract job result: ${CONTRACT_RESULT:-unknown}; merge authorized: ${MERGE_AUTHORIZED:-false}"
          # Fail closed on anything that is not an explicit success + explicit true.
          if [[ "${CONTRACT_RESULT:-}" != "success" ]]; then
            echo "::error::PR contract validation did not succeed (${CONTRACT_RESULT:-unknown}); no merge authorization can be reported."
            exit 1
          fi
          if [[ "${MERGE_AUTHORIZED:-}" != "true" ]]; then
            echo "::error::This exact head is not authorized to merge: the verdict is not merge-approved (or merge-self-approved) backed by the review evidence the contract requires. The PR contract itself is valid — only the approval is pending."
            exit 1
          fi
          echo "Merge authorized for this exact head."