name: Spoofed version drift

# We impersonate Claude Code and Gemini CLI via User-Agent / attribution
# headers. Anthropic gates newer models behind a minimum client version, so a
# stale `claude-cli/<version>` shows up as an HTTP 400 on a model that is
# otherwise available. The constants were only ever bumped by hand and had
# drifted (Gemini CLI by six minor releases), so this schedules the existing
# drift check.
#
# Detection only, deliberately. The job holds no write scope: the repository
# runs a default-deny token policy (scripts/check-workflow-permissions.ts) with
# exactly three narrowly-justified exceptions, and the dev ruleset requires
# an approving GitHub review — so a bot-opened PR would still need a maintainer.
# Buying `contents: write` + `pull-requests: write` for a daily cron would not
# remove that review, it would only widen the token surface. A red
# scheduled run is the signal; remediation is one command:
#
#   bun scripts/check-spoofed-versions.ts --update
#
# This check is intentionally NOT part of `ci:check:full`: an upstream release
# would otherwise redden every unrelated pull request instead of raising a
# maintenance signal here.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check spoofed external tool versions
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.0"
      - name: Compare spoofed versions against upstream releases
        id: drift
        run: bun scripts/check-spoofed-versions.ts
      - name: Explain remediation on drift
        if: ${{ failure() && steps.drift.outcome == 'failure' }}
        run: |
          {
            echo "## Spoofed version drift"
            echo
            echo "An impersonated tool released a newer version. Anthropic gates newer"
            echo "models behind a minimum client version, so a stale fingerprint surfaces"
            echo "as an HTTP 400 on a model the account can otherwise reach."
            echo
            echo 'Remediation, from a `dev` checkout:'
            echo
            echo '```sh'
            echo 'bun scripts/check-spoofed-versions.ts --update'
            echo '```'
            echo
            echo "Then open a pull request targeting \`dev\` with a CHANGELOG entry."
          } >> "$GITHUB_STEP_SUMMARY"
