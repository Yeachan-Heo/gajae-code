      CI_DEV_PLAN_MODE: ${{ needs.affected-plan.outputs.plan_mode }}
      CI_DEV_SHARD_RECEIPTS: .ci-dev-shard-receipts
      CI_DEV_EVIDENCE_ROOT: .
