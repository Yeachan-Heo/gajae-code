          bun test ./packages/coding-agent/test/session/managed-lock-lease.windows.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test ./packages/coding-agent/test/sdk-session-directory.windows.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test ./packages/coding-agent/test/sdk-session-index-fsync.windows.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test ./packages/coding-agent/test/sdk-session-index-lock-contention.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The session-state lock's owner-record create/retract protocol depends on
          # Windows handle-sharing semantics (no FILE_SHARE_DELETE on the create
          # descriptor), so its suite is proven here rather than on Ubuntu (#4990).
          bun test ./packages/coding-agent/test/session-state-lock.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test ./packages/coding-agent/test/sdk-lifecycle-ready-then-exit.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test ./packages/natives/test/windows-avx2-probe.windows.test.ts --timeout 10000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test ./packages/utils/test/env-provenance.windows.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test ./packages/natives/test/windows-hidden-shell.windows.test.ts --timeout 90000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows hidden-console creation-flag unit tests
        shell: pwsh
        run: |
          cargo test -p pi-shell --lib windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p pi-shell --lib embedded_external_command_console_window_visibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


