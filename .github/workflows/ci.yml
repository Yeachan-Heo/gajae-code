name: CI

on:
   push:
      branches: [main]
      tags: ["v*"]
   pull_request:
      branches: [main]
   schedule:
      - cron: "23 4 * * *"
   workflow_dispatch:
      inputs:
         rehearsal:
            description: "Run the exact tag build/verify graph, the non-tag main graph, or publish an immutable nightly prerelease after the full source graph passes. Manual nightlies release dev; scheduled nightlies release main."
            required: true
            type: choice
            options: [tag-build-verify, main-nontag, nightly-release]

# Least privilege by default: only `publish` needs write, and it declares its
# own job-level `contents: write` override. This keeps rehearsal dispatches
# (and every build/verify job) on a read-scoped GITHUB_TOKEN.
permissions:
   contents: read

concurrency:
   # Real stable and nightly publication share one non-cancelling cross-channel
   # lane so npm dist-tags and closed evidence cannot race each other.
   group: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'nightly-release')) && 'gajae-npm-release' || format('ci-{0}-{1}', github.ref, github.event_name == 'workflow_dispatch' && inputs.rehearsal || 'event') }}
   cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'nightly-release')) }}

jobs:
   release_metadata:
      if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'tag-build-verify') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'nightly-release') }}
      runs-on: ubuntu-22.04
      timeout-minutes: 5
      outputs:
         channel: ${{ steps.release.outputs.channel }}
         version: ${{ steps.release.outputs.version }}
         nightly_version: ${{ steps.release.outputs.nightly_version }}
         tag_name: ${{ steps.release.outputs.tag_name }}
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
           with:
              bun-version: "1.3.14"
         - name: Resolve immutable release identity
           id: release
           shell: bash
           env:
              IS_NIGHTLY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'nightly-release')) && '1' || '0' }}
              EVENT_NAME: ${{ github.event_name }}
              SOURCE_SHA: ${{ github.sha }}
              RUN_ID: ${{ github.run_id }}
           run: |
              set -euo pipefail
              if [ "$IS_NIGHTLY" = 1 ]; then
                 expected_ref=refs/heads/dev
                 if [ "$EVENT_NAME" = schedule ]; then
                    expected_ref=refs/heads/main
                 fi
                 if [ "$GITHUB_REF" != "$expected_ref" ]; then
                    echo "Nightly release for $EVENT_NAME must run from $expected_ref, not $GITHUB_REF" >&2
                    exit 1
                 fi
                 timestamp="$(git show -s --format=%cI "$SOURCE_SHA")"
                 version="$(bun scripts/nightly-release.ts version --timestamp "$timestamp" --run-id "$RUN_ID" --source-sha "$SOURCE_SHA")"
                 {
                    echo "channel=nightly"
                    echo "version=$version"
                    echo "nightly_version=$version"
                    echo "tag_name=v$version"
                 } >> "$GITHUB_OUTPUT"
              elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                 version="${GITHUB_REF_NAME#v}"
                 if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "Stable release tag must be exact vX.Y.Z, received $GITHUB_REF_NAME" >&2
                    exit 1
                 fi
                 manifest_version="$(bun -e 'const manifest = await Bun.file("packages/coding-agent/package.json").json(); process.stdout.write(manifest.version)')"
                 if [ "$manifest_version" != "$version" ]; then
                    echo "Stable release tag $GITHUB_REF_NAME does not match package version $manifest_version" >&2
                    exit 1
                 fi
                 {
                    echo "channel=stable"
                    echo "version=$version"
                    echo "nightly_version="
                    echo "tag_name=$GITHUB_REF_NAME"
                 } >> "$GITHUB_OUTPUT"
              else
                 {
                    echo "channel=rehearsal"
                    echo "version="
                    echo "nightly_version="
                    echo "tag_name="
                 } >> "$GITHUB_OUTPUT"
              fi
   # ---------------------------------------------------------------------------
   # PR + main branch: lint/typecheck (native-free) and the test suite.
   # These never run on tags — a tag is cut from an already-green main.
   # ---------------------------------------------------------------------------
   check:
      if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.rehearsal == 'main-nontag' || inputs.rehearsal == 'nightly-release') }}
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
           with:
              node-version: "24"
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
           with:
              bun-version: "1.3.14"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
           with:
              path: ~/.bun/install/cache
              key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Lint and type check (native-free)
           run: bun run ci:check:full

   # ---------------------------------------------------------------------------
   # PR + main branch: sharded full test suite. Unlike dev CI (changed-path
   # affected), Main CI runs the COMPLETE task union via CI_FORCE_FULL. Long-tail
   # tasks are sub-split (coding-agent tests 16-way, rust-test 4 nextest
   # partitions) so no single shard dominates wall-time. The `test` aggregate job
   # keeps the stable branch-protection status name.
   # ---------------------------------------------------------------------------
   main_plan:
      if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.rehearsal == 'main-nontag' || inputs.rehearsal == 'nightly-release') }}
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      env:
         CI_FORCE_FULL: "1"
         CI_CODING_AGENT_TEST_SHARDS: "16"
         CI_RUST_TEST_PARTITIONS: "4"
      outputs:
         matrix: ${{ steps.plan.outputs.matrix }}
         has_tasks: ${{ steps.plan.outputs.has_tasks }}
         has_native: ${{ steps.plan.outputs.has_native }}
         has_python: ${{ steps.plan.outputs.has_python }}
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
           with:
              bun-version: "1.3.14"
         - name: Compute full Main CI task matrix
           id: plan
           run: bun scripts/ci-dev-affected.ts --matrix-json

   main_native:
      if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.rehearsal == 'main-nontag' || inputs.rehearsal == 'nightly-release') && needs.main_plan.outputs.has_native == 'true' }}
      needs: [main_plan]
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
           with:
              node-version: "24"
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
           with:
              bun-version: "1.3.14"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
           with:
              path: ~/.bun/install/cache
              key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Build native addon (linux-x64 baseline + modern)
           env:
              TARGET_PLATFORM: linux
              TARGET_ARCH: x64
              TARGET_VARIANTS: baseline modern
           run: bun run ci:build:native
         - name: Verify required native addon variants
           run: |
              test -f packages/natives/native/pi_natives.linux-x64-baseline.node
              test -f packages/natives/native/pi_natives.linux-x64-modern.node
         - name: Upload native addon(s)
           uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
           with:
              name: main-native-${{ github.run_id }}
              path: |
                 packages/natives/native/pi_natives.linux-x64-baseline.node
                 packages/natives/native/pi_natives.linux-x64-modern.node
              if-no-files-found: error
              retention-days: 1
              overwrite: true


   main_shards:
      name: test-shard / ${{ matrix.key }}
      if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.rehearsal == 'main-nontag' || inputs.rehearsal == 'nightly-release') && needs.main_plan.outputs.has_tasks == 'true' && needs.main_native.result != 'failure' && needs.main_native.result != 'cancelled' }}
      needs: [main_plan, main_native]
      runs-on: ubuntu-22.04
      timeout-minutes: ${{ matrix.rust && 90 || 60 }}
      strategy:
         fail-fast: false
         max-parallel: 16
         matrix: ${{ fromJSON(needs.main_plan.outputs.matrix) }}
      env:
         CI_FORCE_FULL: "1"
         CI_CODING_AGENT_TEST_SHARDS: "16"
         CI_RUST_TEST_PARTITIONS: "4"
         AFFECTED_TASK_KEY: ${{ matrix.key }}
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
           with:
              node-version: "24"
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
           with:
              bun-version: "1.3.14"
         - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
           if: ${{ matrix.rust }}
           with:
              toolchain: nightly-2026-04-29
         - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e  # v2
           if: ${{ matrix.nextest }}
           with:
              tool: nextest@0.9.137
         - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
           if: ${{ matrix.rust }}
           with:
              shared-key: main-rust-linux-x64
              save-if: ${{ github.ref == 'refs/heads/main' }}
              cache-workspace-crates: true
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
           with:
              path: ~/.bun/install/cache
              key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Download native addon(s)
           if: ${{ matrix.native }}
           uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
           with:
              name: main-native-${{ github.run_id }}
              path: packages/natives/native
         - name: Run task shard
           env:
              GITHUB_ACTIONS: ""
           run: bun scripts/ci-dev-affected.ts --task="$AFFECTED_TASK_KEY"

   acp_conformance:
      if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.rehearsal == 'main-nontag' || inputs.rehearsal == 'nightly-release') && needs.main_plan.outputs.has_tasks == 'true' && needs.main_native.result != 'failure' && needs.main_native.result != 'cancelled' }}
      needs: [main_plan, main_native]
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
           with:
              node-version: "24"
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
           with:
              bun-version: "1.3.14"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
           with:
              path: ~/.bun/install/cache
              key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Download native addon(s)
           uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
           with:
              name: main-native-${{ github.run_id }}
              path: packages/natives/native
         - name: Run ACP conformance
           run: |
              # Real (non-symlinked) seeded scratch workspace, matching the promoted baseline:
              # the ACP client enforces its session cwd root against the resolved path.
              scratch="$(mktemp -d "$RUNNER_TEMP/acp-conformance-XXXXXX")"
              scratch="$(cd "$scratch" && pwd -P)"
              printf 'acpx conformance workspace\n' > "$scratch/README.md"
              bun run conformance:run -- \
                 --agent-command "bun packages/coding-agent/scripts/acp-conformance-agent.ts" \
                 --format json \
                 --report "$RUNNER_TEMP/acp-conformance/report.json" \
                 --cwd "$scratch"
         - name: Upload ACP conformance report
           if: ${{ always() }}
           uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
           with:
              name: acp-conformance-report-${{ github.run_id }}
              path: ${{ runner.temp }}/acp-conformance/report.json
              if-no-files-found: warn
              retention-days: 7
              overwrite: true

   # Branch protection must keep requiring this stable aggregate status.
   test:
      if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.rehearsal == 'main-nontag' || inputs.rehearsal == 'nightly-release') }}
      needs: [main_plan, main_native, main_shards, acp_conformance]
      runs-on: ubuntu-22.04
      timeout-minutes: 5
      steps:
         - name: Fail closed unless every shard succeeded
           run: |
              plan='${{ needs.main_plan.result }}'
              native='${{ needs.main_native.result }}'
              shards='${{ needs.main_shards.result }}'
              conformance='${{ needs.acp_conformance.result }}'
              echo "main_plan=$plan main_native=$native main_shards=$shards acp_conformance=$conformance"
              test "$plan" = success
              case "$native" in success|skipped) ;; *) echo "native gate failed"; exit 1;; esac
              test "$shards" = success
              test "$conformance" = success

   nightly_gate:
      if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'nightly-release')) }}
      needs: [check, test]
      runs-on: ubuntu-22.04
      timeout-minutes: 5
      steps:
         - name: Require the complete main verification graph
           run: |
              test '${{ needs.check.result }}' = success
              test '${{ needs.test.result }}' = success

   # ---------------------------------------------------------------------------
   # Stable tags and verified nightly runs build native addons for every published
   # platform, then standalone binaries. Rehearsals stop after binary verification;
   # nightly publication waits for `nightly_gate` before touching npm or GitHub.
   # ---------------------------------------------------------------------------
   native:
      if: ${{ always() && needs.release_metadata.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'tag-build-verify') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'nightly-release')) }}
      needs: [release_metadata]
      timeout-minutes: 90
      runs-on: ${{ matrix.os }}
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: ubuntu-22.04, platform: linux, arch: x64, variant: baseline, rust_checks: true }
               - { os: ubuntu-22.04, platform: linux, arch: x64, variant: modern }
               - { os: ubuntu-22.04, platform: linux, arch: arm64, target: aarch64-unknown-linux-gnu }
               - { os: macos-14, platform: darwin, arch: arm64 }
               - { os: macos-15-intel, platform: darwin, arch: x64, variant: baseline }
               - { os: windows-latest, platform: win32, arch: x64, variant: baseline }
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: ./.github/actions/build-native
           with:
              hash: ${{ github.sha }}
              platform: ${{ matrix.platform }}
              arch: ${{ matrix.arch }}
              variant: ${{ matrix.variant }}
              target: ${{ matrix.target }}
              rust_checks: ${{ matrix.rust_checks && 'true' || 'false' }}
              save_cache: "true"
              nightly_version: ${{ needs.release_metadata.outputs.nightly_version }}

   binaries:
      if: ${{ always() && needs.release_metadata.result == 'success' && needs.native.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'tag-build-verify') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'nightly-release')) }}
      needs: [native, release_metadata]
      timeout-minutes: 60
      runs-on: ${{ matrix.os }}
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: ubuntu-22.04, platform: linux, arch: x64, target_id: linux-x64, binary_path: packages/coding-agent/binaries/gjc-linux-x64 }
               - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, target_id: linux-arm64, binary_path: packages/coding-agent/binaries/gjc-linux-arm64 }
               - { os: macos-14, platform: darwin, arch: arm64, target_id: darwin-arm64, binary_path: packages/coding-agent/binaries/gjc-darwin-arm64 }
               - { os: macos-15-intel, platform: darwin, arch: x64, target_id: darwin-x64, binary_path: packages/coding-agent/binaries/gjc-darwin-x64 }
               - { os: windows-latest, platform: win32, arch: x64, target_id: win32-x64, binary_path: packages/coding-agent/binaries/gjc-windows-x64.exe }
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
           with:
              node-version: "24"
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
           with:
              bun-version: "1.3.14"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
           with:
              path: ~/.bun/install/cache
              key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Stage nightly release version
           if: ${{ needs.release_metadata.outputs.nightly_version != '' }}
           run: bun scripts/nightly-release.ts stage --version "${{ needs.release_metadata.outputs.nightly_version }}" --source-sha "${{ github.sha }}"
         - name: Download native addon(s)
           uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
           with:
              pattern: pi-natives-${{ matrix.platform }}-${{ matrix.arch }}*
              path: packages/natives/native
              merge-multiple: true
         - name: Verify memory-guard native loader export
           run: bun test packages/natives/test/memory-guard-native.test.ts

         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Smoke memory-guard native route (Windows)
           if: runner.os == 'Windows'
           shell: pwsh
           run: |
              $json = & "${{ matrix.binary_path }}" internal memory-guard-native-smoke --json
              $data = $json | ConvertFrom-Json
              if ($data.api -ne "memory_guard_windows_job_probe_v1") {
                 throw "unexpected api: $($data.api)"
              }
              if ($data.source -ne "pi_natives") {
                 throw "unexpected source: $($data.source)"
              }
              if ($data.result.platform -ne "win32") {
                 throw "unexpected platform: $($data.result.platform)"
              }
              if (@("job_snapshot", "not_in_job", "api_error") -notcontains $data.result.kind) {
                 throw "unexpected result kind: $($data.result.kind)"
              }
         - name: Smoke release binary
           if: runner.os != 'Windows'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke release binary (Windows)
           if: runner.os == 'Windows'
           shell: pwsh
           run: |
              $runtimeDir = Join-Path $env:TEMP ("gjc-runtime-" + [System.Guid]::NewGuid().ToString("N"))
              New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
              $env:HOME = Join-Path $runtimeDir "home"
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              & "${{ matrix.binary_path }}" --version
              & "${{ matrix.binary_path }}" --smoke-test
         - name: Upload release binary artifact
           uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
           with:
              name: gjc-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}

   publish:
      if: ${{ always() && needs.native.result == 'success' && needs.binaries.result == 'success' && ((needs.release_metadata.outputs.channel == 'stable' && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch') || (needs.release_metadata.outputs.channel == 'nightly' && needs.nightly_gate.result == 'success')) }}
      needs: [native, binaries, release_metadata, nightly_gate]
      timeout-minutes: 45
      runs-on: ubuntu-22.04
      permissions:
         contents: write
         # npm trusted publishing (OIDC): npm >= 11.5.1 exchanges this job's
         # GitHub OIDC token for a short-lived registry credential, so no
         # long-lived NPM_TOKEN is involved and nothing expires under us.
         id-token: write
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
           with:
              node-version: "24"
         - name: Pin npm for OIDC trusted publishing
           # Trusted publishing requires npm >= 11.5.1; do not rely on whatever
           # npm the Node distribution happens to bundle.
           run: npm install -g npm@^11.5.1
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
           with:
              bun-version: "1.3.14"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
           with:
              path: ~/.bun/install/cache
              key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Stage nightly release version
           if: ${{ needs.release_metadata.outputs.nightly_version != '' }}
           run: bun scripts/nightly-release.ts stage --version "${{ needs.release_metadata.outputs.nightly_version }}" --source-sha "${{ github.sha }}"
         - name: Download all native addons
           uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
           with:
              pattern: pi-natives-*
              path: packages/natives/native
              merge-multiple: true
         - name: Prepare immutable package evidence
           env:
              RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.channel }}
           run: |
              set -euo pipefail
              evidence_dir="$RUNNER_TEMP/release-evidence"
              rm -rf "$evidence_dir"
              bun scripts/ci-release-publish.ts --prepare-evidence --evidence-dir "$evidence_dir" --release-channel "$RELEASE_CHANNEL"
         - name: Persist pre-publication package evidence
           uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
           with:
              name: release-evidence-${{ needs.release_metadata.outputs.version }}
              path: ${{ runner.temp }}/release-evidence
              if-no-files-found: error
              retention-days: 30
              overwrite: true
         - name: Reject pre-existing release tag or release
           env:
              GH_TOKEN: ${{ github.token }}
              TAG_NAME: ${{ needs.release_metadata.outputs.tag_name }}
              SOURCE_SHA: ${{ github.sha }}
           shell: bash
           run: |
              set -euo pipefail
              # Reject any pre-existing tag that does not peel to this run's source.
              # Lightweight tags report the commit directly; annotated tags require
              # the peeled ^{} ref. ls-remote --tags emits both lines; we match the
              # peeled line when present and fall back to the direct ref otherwise.
              raw_remote="$(git ls-remote --tags origin "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}")"
              if [ -n "$raw_remote" ]; then
                 peeled="$(printf '%s\n' "$raw_remote" | awk -F '\t' '$2 ~ /\^\{\}$/ { print $1; exit }')"
                 if [ -z "$peeled" ]; then
                    peeled="$(printf '%s\n' "$raw_remote" | awk -F '\t' '$2 !~ /\^\{\}$/ { print $1; exit }')"
                 fi
                 if [ "$peeled" != "$SOURCE_SHA" ]; then
                    echo "Release tag $TAG_NAME already exists and peels to ${peeled:-<empty>}, not $SOURCE_SHA; refusing upsert" >&2
                    exit 1
                 fi
              fi
              status="$(curl --silent --show-error --output "$RUNNER_TEMP/release-preflight.json" --write-out '%{http_code}' \
                 --header "Authorization: Bearer $GH_TOKEN" \
                 --header "Accept: application/vnd.github+json" \
                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME")"
              case "$status" in
                 404) ;;
                 200) echo "Release $TAG_NAME already exists; refusing upsert" >&2; exit 1 ;;
                 *) echo "Cannot verify release absence: GitHub API returned HTTP $status" >&2; exit 1 ;;
              esac
         - name: Publish packages to npm
           env:
              RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.channel }}
           shell: bash
           run: |
              set -euo pipefail
              evidence_dir="$RUNNER_TEMP/release-evidence"
              if [ "$RELEASE_CHANNEL" = nightly ]; then
                 serialization_key=gajae-nightly-release
              else
                 serialization_key=gajae-production-release
              fi
              # Deliberately no registry credential in scope: any stale one
              # would take precedence over OIDC and fail closed with a registry
              # 404 that reads like a missing package.
              bun scripts/ci-release-publish.ts --publish-from-evidence \
                 --evidence-dir "$evidence_dir" \
                 --release-serialization-key "$serialization_key" \
                 --release-channel "$RELEASE_CHANNEL"
         - name: Download release binaries
           uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
           with:
              pattern: gjc-binary-*
              path: release-binaries
              merge-multiple: true
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
           with:
              tag_name: ${{ needs.release_metadata.outputs.tag_name }}
              target_commitish: ${{ github.sha }}
              name: ${{ needs.release_metadata.outputs.channel == 'nightly' && format('GJC Nightly {0}', needs.release_metadata.outputs.version) || format('GJC {0}', needs.release_metadata.outputs.version) }}
              draft: false
              prerelease: ${{ needs.release_metadata.outputs.channel == 'nightly' }}
              make_latest: ${{ needs.release_metadata.outputs.channel != 'nightly' }}
              generate_release_notes: true
              fail_on_unmatched_files: true
              files: |
                 release-binaries/gjc-*
                 ${{ runner.temp }}/release-evidence/gajae-release-packages-expected-v1.json
                 ${{ runner.temp }}/release-evidence/gajae-release-packages-v1.json
                 ${{ runner.temp }}/release-evidence/gajae-release-channel-v1.json
         - name: Verify immutable GitHub Release
           env:
              GH_TOKEN: ${{ github.token }}
              TAG_NAME: ${{ needs.release_metadata.outputs.tag_name }}
              EXPECTED_PRERELEASE: ${{ needs.release_metadata.outputs.channel == 'nightly' && 'true' || 'false' }}
              SOURCE_SHA: ${{ github.sha }}
           shell: bash
           run: |
              set -euo pipefail
              git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
              resolved="$(git rev-parse "$TAG_NAME^{commit}")"
              test "$resolved" = "$SOURCE_SHA" || { echo "Release tag $TAG_NAME resolves to $resolved, expected $SOURCE_SHA" >&2; exit 1; }
              release_json="$RUNNER_TEMP/release-final.json"
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" > "$release_json"
              RELEASE_JSON="$release_json" bun -e '
                 const release = await Bun.file(Bun.env.RELEASE_JSON).json();
                 const expectedPrerelease = Bun.env.EXPECTED_PRERELEASE === "true";
                 if (release.tag_name !== Bun.env.TAG_NAME || release.draft !== false || release.prerelease !== expectedPrerelease) {
                    throw new Error("GitHub Release identity/state does not match the requested release");
                 }
                 const expectedAssets = [
                    "gjc-linux-x64", "gjc-linux-arm64", "gjc-darwin-arm64", "gjc-darwin-x64", "gjc-windows-x64.exe",
                    "gajae-release-packages-expected-v1.json", "gajae-release-packages-v1.json", "gajae-release-channel-v1.json",
                 ];
                 const assets = new Set(release.assets.map(asset => asset.name));
                 const missing = expectedAssets.filter(name => !assets.has(name));
                 if (missing.length > 0) throw new Error("GitHub Release is missing assets: " + missing.join(", "));
              '
