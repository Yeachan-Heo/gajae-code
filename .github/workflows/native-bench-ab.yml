name: Native benchmark A/B

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Benchmark suite to compare (any SUITES key in scripts/native-bench-ab.ts, or profile-stability)"
        required: true
        type: string
        default: rss
      base:
        description: Git ref to use as the baseline
        required: true
        type: string
        default: origin/main
      iterations:
        description: Optional per-block iteration count passed to the adapter (empty keeps its default)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  benchmark:
    name: Compare native benchmark on a quiet macOS host
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
        with:
          toolchain: nightly-2026-08-12
      - name: Prepend rustup toolchain bin to PATH
        shell: bash
        run: echo "$(dirname "$(rustup which cargo)")" >> "$GITHUB_PATH"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build native addon
        if: ${{ inputs.suite == 'profile-stability' }}
        run: bun run build:native
      - name: Profile twice and compare top self-time functions (AC1a.3)
        if: ${{ inputs.suite == 'profile-stability' }}
        run: |
          set -euo pipefail
          mkdir -p .gjc/profiles/profile-stability
          # The native build leaves the runner saturated; profile only once the
          # 1-minute load settles below half the cores (AC1a.3 needs a quiet host).
          cores=$(sysctl -n hw.ncpu)
          quiet=0
          for _ in $(seq 1 90); do
            load=$(sysctl -n vm.loadavg | awk '{print $2}')
            if awk -v l="$load" -v c="$cores" 'BEGIN { exit !(l < c / 2) }'; then quiet=1; break; fi
            sleep 10
          done
          if [ "$quiet" -ne 1 ]; then
            echo "::error::runner never became quiet (1-minute load $load, need < $cores/2); stability comparison not run"
            uptime | tee .gjc/profiles/profile-stability/load-never-quiet.txt
            exit 1
          fi
          uptime | tee .gjc/profiles/profile-stability/load-before.txt
          # Warm module, transpiler and fixture caches so both measured runs start alike.
          bun run bench:profile -- --scenario all --out .gjc/profiles/profile-stability/warmup > /dev/null
          bun run bench:profile -- --scenario all --out .gjc/profiles/profile-stability/run1 | tee .gjc/profiles/profile-stability/run1.log
          bun run bench:profile -- --scenario all --out .gjc/profiles/profile-stability/run2 --compare .gjc/profiles/profile-stability/run1/report.json | tee .gjc/profiles/profile-stability/run2.log
          uptime | tee .gjc/profiles/profile-stability/load-after.txt
      - name: Upload profile stability evidence
        if: ${{ always() && inputs.suite == 'profile-stability' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: profile-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .gjc/profiles/profile-stability/*.log
            .gjc/profiles/profile-stability/*.txt
            .gjc/profiles/profile-stability/*/report.json
            .gjc/profiles/profile-stability/*/report.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Run native benchmark A/B
        if: ${{ inputs.suite != 'profile-stability' }}
        env:
          SUITE: ${{ inputs.suite }}
          BASE: ${{ inputs.base }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          # native-bench-ab.ts rejects a 1-minute load above half the physical
          # cores; wait for dependency install/toolchain setup to drain first.
          cores=$(sysctl -n hw.physicalcpu)
          quiet=0
          for _ in $(seq 1 90); do
            load=$(sysctl -n vm.loadavg | awk '{print $2}')
            if awk -v l="$load" -v c="$cores" 'BEGIN { exit !(l <= c / 2) }'; then quiet=1; break; fi
            sleep 10
          done
          if [ "$quiet" -ne 1 ]; then
            echo "::error::runner never became quiet (1-minute load $load, need <= $cores/2); A/B not run"
            exit 1
          fi
          # macOS ships Bash 3.2, where expanding an empty array under `set -u`
          # is an unbound-variable error, so branch instead of splicing args.
          if [ -n "$ITERATIONS" ]; then
            bun scripts/native-bench-ab.ts --suite "$SUITE" --base "$BASE" --allow-baseline-drift --json --iterations "$ITERATIONS" > native-bench-ab.json
          else
            bun scripts/native-bench-ab.ts --suite "$SUITE" --base "$BASE" --allow-baseline-drift --json > native-bench-ab.json
          fi
      - name: Upload benchmark JSON
        if: ${{ always() && inputs.suite != 'profile-stability' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: native-bench-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-bench-ab.json
          if-no-files-found: error
          retention-days: 30
