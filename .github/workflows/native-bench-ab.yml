name: Native benchmark A/B

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to compare
        required: true
        type: choice
        default: rss
        options: [rss, edit-hotspots, grep, profile-stability]
      base:
        description: Git ref to use as the baseline
        required: true
        type: string
        default: origin/main

permissions:
  contents: read

jobs:
  benchmark:
    name: Compare native benchmark on a quiet macOS host
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
        with:
          toolchain: nightly-2026-08-12
      - name: Prepend rustup toolchain bin to PATH
        shell: bash
        run: echo "$(dirname "$(rustup which cargo)")" >> "$GITHUB_PATH"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build native addon
        if: ${{ inputs.suite == 'profile-stability' }}
        run: bun run build:native
      - name: Profile twice and compare top self-time functions (AC1a.3)
        if: ${{ inputs.suite == 'profile-stability' }}
        run: |
          set -euo pipefail
          mkdir -p .gjc/profiles/profile-stability
          uptime | tee .gjc/profiles/profile-stability/load-before.txt
          bun run bench:profile -- --scenario all --out .gjc/profiles/profile-stability/run1 | tee .gjc/profiles/profile-stability/run1.log
          bun run bench:profile -- --scenario all --out .gjc/profiles/profile-stability/run2 --compare .gjc/profiles/profile-stability/run1/report.json | tee .gjc/profiles/profile-stability/run2.log
          uptime | tee .gjc/profiles/profile-stability/load-after.txt
      - name: Upload profile stability evidence
        if: ${{ always() && inputs.suite == 'profile-stability' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: profile-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .gjc/profiles/profile-stability/*.log
            .gjc/profiles/profile-stability/*.txt
            .gjc/profiles/profile-stability/*/report.json
            .gjc/profiles/profile-stability/*/report.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Run native benchmark A/B
        if: ${{ inputs.suite != 'profile-stability' }}
        env:
          SUITE: ${{ inputs.suite }}
          BASE: ${{ inputs.base }}
        run: bun scripts/native-bench-ab.ts --suite "$SUITE" --base "$BASE" --allow-baseline-drift --json > native-bench-ab.json
      - name: Upload benchmark JSON
        if: ${{ always() && inputs.suite != 'profile-stability' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: native-bench-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-bench-ab.json
          if-no-files-found: error
          retention-days: 30
