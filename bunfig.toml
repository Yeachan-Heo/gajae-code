telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
minimumReleaseAgeExcludes = ["@types/bun", "bun-types"]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
preload = ["./scripts/test-preload.ts"]
pathIgnorePatterns = [
  "**/node_modules/**",
  ".wt/**",
  ".worktrees/**",
  # Spawns a broker plus a session host per run and costs tens of seconds, so it
  # stays out of the default suite. Naming the path on the command line does NOT
  # re-include it -- `bun test <path>` is a filter over already-discovered files,
  # so a pruned file can never match. The only way to run it is to override this
  # list with `--path-ignore-patterns`, which is what the CI job does.
  "**/test/acp/acp-lifecycle-smoke.test.ts",
]

[run]
bun = true
